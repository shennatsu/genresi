repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
        exclude: __manifest__\.py$
      - id: ruff-format
        exclude: __manifest__\.py$
  - repo: https://github.com/oca/pylint-odoo
    rev: v9.0.0
    hooks:
      - id: pylint_odoo
        exclude: __manifest__\.py$
        additional_dependencies:
          - Pillow==11.1.0
        args:
          - --init-hook=import sys; sys.path.insert(0, r'D:/odoo/Odoo17/server')

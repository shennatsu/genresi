[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".odoo_runtime", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.optional-dependencies]
dev = [
    "pre-commit==4.1.0",
    "ruff==0.9.10",
    "pylint-odoo==9.0.0",
    "Pillow==11.1.0",
]
